name: Futurisys CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Version stabilisée pour éviter les erreurs de compilation Pandas/Cython

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov httpx huggingface_hub

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
          PYTHONPATH: . 
        run: |
          python -m pytest --cov=app --cov-report=term-missing

  deploy-to-huggingface:
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 # Important pour Hugging Face Spaces

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # Utilisation du secret harmonisé
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path='.',
              repo_id='dataChaser/predict_building_carbon_footprint',
              repo_type='space',
              token=os.environ['HF_TOKEN'],
              ignore_patterns=['.git*', 'projet5_venv/', '__pycache__/', 'tests/', '.gradio/']
          )
          "
