name: Futurisys CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov httpx alembic  # Ajout d'alembic ici

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
          PYTHONPATH: .
        run: alembic upgrade head  # Crée les tables proprement via tes scripts de version

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/testdb
          PYTHONPATH: .
        run: |
          python -m pytest --cov=app --cov-report=term-missing

  deploy-to-huggingface:
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HF Hub
        run: pip install huggingface_hub

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ ERREUR : Le secret HF_TOKEN est vide ou non configuré dans GitHub."
            exit 1
          fi
          python -c "
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          api = HfApi(token=token)
          api.upload_folder(
              folder_path='.',
              repo_id='dataChaser/predict_building_carbon_footprint',
              repo_type='space',
              token=os.environ['HF_TOKEN'],
              ignore_patterns=['.git*', 'projet5_venv/', '__pycache__/', 'tests/', '.gradio/']
>>>>>>> f7eeb4eeceb0ac0e007c237db4ae59afb85ce38b
          )
          "