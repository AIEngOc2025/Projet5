name: Futurisys CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # Crucial pour récupérer le modèle .joblib

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov huggingface_hub

      - name: Run Tests with Coverage
        run: |
          # On définit des variables d'env factices pour les tests
          export DATABASE_URL="postgresql://user:pass@localhost/testdb"
          pytest --cov=app --cov-report=term-missing

  deploy-to-huggingface:
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path='.',
              repo_id='dataChaser/predict_building_carbon_footprint',
              repo_type='space',
              token='${{ secrets.HF_TOKEN }}',
              ignore_patterns=['.git*', 'venv/', '__pycache__/', 'tests/']
          )
          "